# Paper trading with the DEMO quoter (plumbing test only; PnL is meaningless).
# Public market-data websockets only; no API keys, no orders are ever sent to Binance.
run:
  tag: demo
  seed: 42
  out_dir: reports

data:
  symbol: ETHUSDT
  source: live
  streams: [trades, quotes, depth]   # what the live feed delivers

strategy:
  name: demo_quoter
  params: {half_spread_ticks: 2, order_qty: 0.05, max_position: 0.5, requote_ticks: 1}

fill_model:
  type: l2                       # live feed has the full book
  require_trade_through: false
  cancel_assumption: proportional

latency:
  # In live paper trading real network delay already exists on the feed, so extra feed latency is 0.
  # The order-entry latency is still simulated (the order is "in flight" this long).
  feed_latency_ms: 0
  order_latency_ms: 30
  timer_interval_ms: 1000

metrics:
  inventory_limit: 0.5

paper:
  log_interval_s: 10
  heartbeat_s: 1

