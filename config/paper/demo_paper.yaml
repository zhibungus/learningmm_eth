# Paper trading with the DEMO quoter (plumbing test only; PnL is meaningless).
# Public market-data websockets only; no API keys, no orders are ever sent to Binance.
run:
  tag: demo
  seed: 42
  out_dir: reports

data:
  symbol: ETHUSDT
  source: live
  streams: [trades, quotes, depth]   # what the live feed delivers

strategy:
  name: demo_quoter
  params: {half_spread_ticks: 2, order_qty: 0.05, max_position: 0.5, requote_ticks: 1}

fill_model:
  type: l2                       # live feed has the full book
  require_trade_through: false
  cancel_assumption: proportional

latency:
  # The engine clock is EXCHANGE time, so the real network delay of the live feed is not part of it and
  # the latencies must be simulated explicitly. The measured defaults from mm/backtest/config.py apply
  # (feed-delay table p50 239 / p90 296 / p99 772 ms, order 132 ms + up to 59 ms jitter, from
  # `python -m mm.data.latency`, 2026-10-19). Zero would be MORE optimistic than any real setup.
  timer_interval_ms: 1000

metrics:
  inventory_limit: 0.5

paper:
  log_interval_s: 10
  heartbeat_s: 1


exchange:
  max_position: 1.0            # exchange-side hard cap (ETH)
  max_order_notional: 5000
